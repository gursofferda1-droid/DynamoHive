<!DOCTYPE html>
<html>
<head>
    <title>DynamoHive GOD MODE</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            background: #05080F;
            color: white;
            font-family: Arial;
            padding: 20px;
        }

        h1 {
            color: #00F0FF;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: #111827;
            padding: 20px;
            border-radius: 10px;
        }

        .title {
            color: #00FF9C;
            margin-bottom: 10px;
            font-weight: bold;
        }

        canvas {
            max-height: 260px;
        }
    </style>
</head>
<body>

<h1>⚡ DynamoHive GOD MODE</h1>

<div class="card">
    <div class="title">SYSTEM STATUS</div>
    <div id="system">loading...</div>
</div>

<div class="grid">
    <div class="card">
        <div class="title">DOMINANCE</div>
        <canvas id="dominanceChart"></canvas>
    </div>

    <div class="card">
        <div class="title">SIGNAL TREND</div>
        <canvas id="trendChart"></canvas>
    </div>
</div>

<div class="grid">
    <div class="card">
        <div class="title">ANOMALIES</div>
        <div id="anomalies">loading...</div>
    </div>

    <div class="card">
        <div class="title">TOP SIGNAL</div>
        <div id="top">loading...</div>
    </div>
</div>

<div class="card" style="margin-top:20px;">
    <div class="title">LIVE FLOW</div>
    <div id="flow">loading...</div>
</div>

<script>
let dominanceChart = null;
let trendChart = null;
let trendData = [];

async function loadMetrics() {
    try {
        const res = await fetch("/metrics");
        const data = await res.json();
        const o = data.orchestrator || {};

        document.getElementById("system").innerHTML = `
            cycles: ${o.cycle_count || 0}<br>
            signals: ${o.last_signal_count || 0}<br>
            generated: ${o.generated_count || 0}<br>
            skipped: ${o.skipped_count || 0}<br>
            duration: ${o.last_duration || 0}s
        `;

        const dominance = Array.isArray(o.dominance) ? o.dominance : [];
        const labels = dominance.map(d => d.topic || "unknown");
        const values = dominance.map(d => d.dominance || 0);

        if (!dominanceChart) {
            dominanceChart = new Chart(
                document.getElementById("dominanceChart"),
                {
                    type: "bar",
                    data: {
                        labels: labels,
                        datasets: [{
                            data: values
                        }]
                    }
                }
            );
        } else {
            dominanceChart.data.labels = labels;
            dominanceChart.data.datasets[0].data = values;
            dominanceChart.update();
        }

        trendData.push(o.last_signal_count || 0);
        if (trendData.length > 20) trendData.shift();

        if (!trendChart) {
            trendChart = new Chart(
                document.getElementById("trendChart"),
                {
                    type: "line",
                    data: {
                        labels: trendData.map((_, i) => i + 1),
                        datasets: [{
                            data: trendData
                        }]
                    }
                }
            );
        } else {
            trendChart.data.labels = trendData.map((_, i) => i + 1);
            trendChart.data.datasets[0].data = trendData;
            trendChart.update();
        }

        const anomalies = Array.isArray(o.anomalies) ? o.anomalies : [];
        document.getElementById("anomalies").innerHTML =
            anomalies.length
                ? anomalies.map(a => `⚠ ${a.topic || "unknown"}`).join("<br>")
                : "none";

        if (dominance.length > 0) {
            document.getElementById("top").innerHTML =
                `${dominance[0].topic} (${dominance[0].dominance})`;
        } else {
            document.getElementById("top").innerHTML = "none";
        }

        document.getElementById("flow").innerHTML =
            dominance.length
                ? dominance.map(d => `→ ${d.topic}`).join("<br>")
                : "no active flow";

    } catch (e) {
        console.error("Dashboard load error:", e);
    }
}

loadMetrics();
setInterval(loadMetrics, 3000);
</script>

</body>
</html>
